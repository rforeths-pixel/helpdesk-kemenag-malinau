<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Helpdesk IT Kemenag Malinau</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="brand">
        <img src="logo-kemenag.png" alt="Logo Kemenag">
        
        <div>
            <strong>Helpdesk IT</strong>
            <span>Kementerian Agama Kabupaten Malinau</span>
        </div>
    </div>

    <div class="menu">
        <a href="#beranda">Beranda</a>
        <a href="#laporan">Buat Laporan</a>
        <a href="#admin">Admin</a>
        <a href="#login">Login</a>
    </div>

</nav>


<section id="beranda" class="hero">

    <h1>Helpdesk IT Kemenag Malinau</h1>

    <p>
        Sistem Helpdesk dan Pelaporan Masalah IT
        berbasis Website.
    </p>

    <a href="#laporan" class="btn">
        Buat Laporan
    </a>

</section>


<section id="laporan">

    <h2>Buat Laporan</h2>

    <form id="formLaporan">

        <label>Nama</label>

        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama"
            required
        >


        <label>Judul Laporan</label>

        <input
            type="text"
            id="judul"
            placeholder="Masukkan judul masalah"
            required
        >


        <label>Deskripsi</label>

        <textarea
            id="deskripsi"
            placeholder="Jelaskan masalah IT"
            required
        ></textarea>


        <button type="submit">
            Kirim Laporan
        </button>

    </form>

</section>


<section id="admin">

    <h2>Admin</h2>

    <div id="daftarLaporan">
        Belum ada laporan.
    </div>

</section>


<section id="login">

    <h2>Login</h2>

    <form id="formLogin">

        <label>Username</label>

        <input
            type="text"
            id="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</section>


<div id="toast"></div>


<script src="script.js"></script>

</body>
</html>
